<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tambah Anggota - E-Sport</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="../index.html">E-Sport Championship</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="../index.html">Beranda</a></li>
                    <li class="nav-item"><a class="nav-link" href="../esport/list.html">Daftar Divisi</a></li>
                    <li class="nav-item"><a class="nav-link" href="../esport/tambah.html">Tambah Divisi</a></li>
                    <li class="nav-item"><a class="nav-link" href="list.html">Daftar Anggota</a></li>
                    <li class="nav-item"><a class="nav-link active" href="tambah.html">Tambah Anggota</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-4">
        <div class="card shadow-sm">
            <div class="card-body">
                <h2 class="card-title mb-3">Form Tambah Anggota Player</h2>
                <form action="#" method="post" id="form-anggota">
                    <div class="mb-3">
                        <label for="no_anggota" class="form-label">No. Anggota</label>
                        <input type="text" class="form-control" id="no_anggota" name="no_anggota" required />
                    </div>
                    <div class="mb-3">
                        <label for="nama" class="form-label">Nama Player</label>
                        <input type="text" class="form-control" id="nama" name="nama" required />
                    </div>
                    <div class="mb-3">
                        <label for="role" class="form-label">Role / Posisi</label>
                        <input type="text" class="form-control" id="role" name="role" />
                    </div>
                    <div class="mb-3">
                        <label for="no_hp" class="form-label">No. HP</label>
                        <input type="tel" class="form-control" id="no_hp" name="no_hp" />
                    </div>
                    <button type="submit" class="btn btn-primary" id="btn-simpan-anggota">Simpan</button>
                    <button type="reset" class="btn btn-secondary" id="btn-reset-anggota">Reset</button>
                </form>
            </div>
        </div>
    </main>

    <footer class="text-center text-muted py-3">
        <p class="mb-0">&copy; 2026 E-Sport Championship &mdash; Jobsheet 3 (Bootstrap)</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>

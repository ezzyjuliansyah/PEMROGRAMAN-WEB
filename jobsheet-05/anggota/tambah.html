<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tambah Anggota - E-Sport</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
    <header class="site-header">
        <h1>E-Sport Championship</h1>
        <p class="site-subtitle">Web Pengelola Data Divisi &amp; Anggota E-Sport</p>
    </header>

    <button type="button" class="nav-toggle-label" aria-label="Buka menu" aria-expanded="false">☰</button>
    <nav class="site-nav">
        <ul>
            <li><a href="../index.html">Beranda</a></li>
            <li><a href="../esport/list.html">Daftar Divisi</a></li>
            <li><a href="../esport/tambah.html">Tambah Divisi</a></li>
            <li><a href="list.html">Daftar Anggota</a></li>
            <li><a href="tambah.html" class="active">Tambah Anggota</a></li>
        </ul>
    </nav>

    <main>
        <div class="content-card">
            <h2>Form Tambah Anggota Player</h2>
            <form action="#" method="post" id="form-anggota">
                <div>
                    <label for="no_anggota">No. Anggota:</label>
                    <input type="text" id="no_anggota" name="no_anggota" />
                </div>
                <div>
                    <label for="nama">Nama Player:</label>
                    <input type="text" id="nama" name="nama" />
                </div>
                <div>
                    <label for="role">Role / Posisi:</label>
                    <input type="text" id="role" name="role" />
                </div>
                <div>
                    <label for="no_hp">No. HP:</label>
                    <input type="tel" id="no_hp" name="no_hp" inputmode="numeric" />
                </div>
                <div class="form-actions">
                    <button type="submit" id="btn-simpan-anggota">Simpan</button>
                    <button type="reset" id="btn-reset-anggota">Reset</button>
                </div>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 E-Sport Championship &mdash; Jobsheet 5</p>
    </footer>
    <script src="../assets/js/app.js"></script>
</body>

</html>

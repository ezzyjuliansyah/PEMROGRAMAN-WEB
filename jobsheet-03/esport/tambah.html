<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tambah Divisi - E-Sport</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
    <header class="site-header">
        <h1>E-Sport Championship</h1>
        <p class="site-subtitle">Web Pengelola Data Divisi &amp; Anggota E-Sport</p>
    </header>

    <input type="checkbox" id="nav-toggle" class="nav-toggle">
    <label for="nav-toggle" class="nav-toggle-label">&#9776;</label>
    <nav class="site-nav">
        <ul>
            <li><a href="../index.html">Beranda</a></li>
            <li><a href="list.html">Daftar Divisi</a></li>
            <li><a href="tambah.html">Tambah Divisi</a></li>
            <li><a href="../anggota/list.html">Daftar Anggota</a></li>
            <li><a href="../anggota/tambah.html">Tambah Anggota</a></li>
        </ul>
    </nav>

    <main>
        <div class="content-card">
            <h2>Form Tambah Divisi</h2>
            <form action="#" method="post" id="form-divisi">
                <div>
                    <label for="kode_divisi">Kode Divisi:</label>
                    <input type="text" id="kode_divisi" name="kode_divisi" required />
                </div>
                <div>
                    <label for="nama_game">Nama Game:</label>
                    <input type="text" id="nama_game" name="nama_game" required />
                </div>
                <div>
                    <label for="platform">Platform:</label>
                    <input type="text" id="platform" name="platform" />
                </div>
                <div>
                    <button type="submit" id="btn-simpan">Simpan</button>
                    <button type="reset" id="btn-reset">Reset</button>
                </div>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 E-Sport Championship &mdash; Jobsheet 3</p>
    </footer>
</body>

</html>

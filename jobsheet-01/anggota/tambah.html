<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tambah Anggota - E-Sport</title>
</head>

<body>
    <header>
        <h1>E-Sport Championship</h1>
        <nav>
            <ul>
                <li><a href="../index.html">Beranda</a></li>
                <li><a href="../esport/list.html">Daftar Divisi</a></li>
                <li><a href="../esport/tambah.html">Tambah Divisi</a></li>
                <li><a href="list.html">Daftar Anggota</a></li>
                <li><a href="tambah.html">Tambah Anggota</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Form Tambah Anggota Player</h2>
            <form action="#" method="post" id="form-anggota">
                <p>
                    <label for="no_anggota">No. Anggota:</label><br />
                    <input type="text" id="no_anggota" name="no_anggota" required />
                </p>
                <p>
                    <label for="nama">Nama Player:</label><br />
                    <input type="text" id="nama" name="nama" required />
                </p>
                <p>
                    <label for="role">Role / Posisi:</label><br />
                    <input type="text" id="role" name="role" />
                </p>
                <p>
                    <label for="no_hp">No. HP:</label><br />
                    <input type="tel" id="no_hp" name="no_hp" />
                </p>
                <p>
                    <button type="submit" id="btn-simpan-anggota">Simpan</button>
                    <button type="reset" id="btn-reset-anggota">Reset</button>
                </p>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 E-Sport Championship &mdash; Jobsheet 1</p>
    </footer>
</body>

</html>

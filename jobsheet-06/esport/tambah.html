<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tambah Divisi - E-Sport</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
    <header>
        <h1>E-Sport Championship</h1>
        <button type="button" class="nav-toggle-label" aria-label="Buka menu" aria-expanded="false">☰</button>
        <nav>
            <ul>
                <li><a href="../index.html">Beranda</a></li>
                <li><a href="list.html">Daftar Divisi</a></li>
                <li><a href="tambah.html">Tambah Divisi</a></li>
                <li><a href="../anggota/list.html">Daftar Anggota</a></li>
                <li><a href="../anggota/tambah.html">Tambah Anggota</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Form Tambah Divisi</h2>
            <form action="#" method="post" id="form-divisi">
                <div>
                    <label for="kode_divisi">Kode Divisi:</label>
                    <input type="text" id="kode_divisi" name="kode_divisi" />
                </div>
                <div>
                    <label for="nama_game">Nama Game:</label>
                    <input type="text" id="nama_game" name="nama_game" />
                </div>
                <div>
                    <label for="platform">Platform:</label>
                    <input type="text" id="platform" name="platform" />
                </div>
                <div class="form-actions">
                    <button type="submit" id="btn-simpan">Simpan</button>
                    <button type="reset" id="btn-reset">Reset</button>
                </div>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 E-Sport Championship &mdash; Jobsheet 6</p>
    </footer>
    <script src="../assets/js/app.js"></script>
</body>

</html>
